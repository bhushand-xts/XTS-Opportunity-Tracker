name: Story-Wise Branch Flow - Integration to QA to Production

# ═══════════════════════════════════════════════════════════════════════════════
# STORY-WISE BRANCH APPROACH (Replaced: Dev Branch Strategy)
#
# Dev Strategy: REMOVED - no predefined dev branches
# Branch Creation: Story branches created ON-DEMAND from ot-integration
# PR Creation: MANUAL - developers create PRs with awareness & quality checks
# Quality Gate: Runs on EVERY PR to ot-integration (must PASS before approval)
#
# Flow:
#  story/JIRA-123 (developer creates)
#    ├─ (make changes)
#    ├─ (quality tests run & PASS)
#    ├─ (manually create PR to ot-integration)
#    ├─ (1 approval required)
#    ├─ (auto-merge to ot-integration)
#    └─→ ot-integration (push)
#         ├─ (auto-create PR to QA)
#         ├─ (QA approves with qa-approved label)
#         ├─ (auto-merge to QA)
#         └─→ main (Parikshit150890 approval required)
#
# KEY RULES:
#  1. Quality gate MUST PASS on PR to ot-integration (blocks if fails)
#  2. PR into ot-integration requires at least 1 approved review before merging
#  3. After review approval, PR is auto-merged to ot-integration (locally, no push yet)
#  4. Developer manually tests and pushes to ot-integration to trigger QA PR
#  5. Auto PR created: ot-integration → QA
#  6. QA team tests and adds label "qa-approved" to approve
#  7. After qa-approved label, PR is auto-merged into QA
#  8. Auto PR created: QA → main (requires Parikshit150890 approval)
#  9. Parikshit150890 approves, auto-merges to main (production)
# 10. Stale PR fix: old open PRs are closed before a new one is created
#
# ⚠️  BRANCH PROTECTION REQUIRED FOR QA (branch)
#
# QA branch MUST have GitHub branch protection rules configured:
#  1. Require pull request reviews (minimum 1 approval from QA team)
#  2. Require status checks to pass (quality-gate-pr, shared-ci)
#  3. Dismiss stale PR approvals when new commits are pushed
#  4. Restrict push access (only bot/QA team allowed)
#  5. Restrict who can merge PRs (QA team only)
#
# Without these rules, anyone can directly push to QA, bypassing QA approval.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - "ot-integration"
      - "QA"
      - "main"

  pull_request:
    # opened/synchronize → shared-ci + quality-gate-pr (draft enforcement)
    # closed             → forward-to-qa after integration merge
    # labeled            → qa-approval-gate
    types: [opened, synchronize, reopened, closed, labeled]
    branches:
      - "ot-integration"
      - "QA"

  # Needed to detect when a reviewer approves a PR into ot-integration
  pull_request_review:
    types: [submitted]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: 80
  SECURITY_SCORE_THRESHOLD: 80
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ===========================================================================
  # JOB 0 - SHARED CI
  # Runs on every push and PR open/synchronize.
  # Lint · Vitest coverage · Trivy security scan · Build
  # All downstream jobs consume its outputs — nothing re-installs.
  # ===========================================================================
  shared-ci:
    name: "Shared CI - Lint, Test, Coverage, Security, Build"
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    outputs:
      lint_status:     ${{ steps.lint.outcome }}
      test_status:     ${{ steps.tests.outcome }}
      build_status:    ${{ steps.build.outcome }}
      coverage_score:  ${{ steps.coverage.outputs.coverage_percent }}
      security_score:  ${{ steps.security.outputs.score }}
      security_detail: ${{ steps.security.outputs.detail }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        continue-on-error: true
        run: npm install

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint || echo "Skipping lint (no package.json)"

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: npm run test:coverage || echo "Skipping tests (no package.json)"

      - name: Parse coverage score
        id: coverage
        run: |
          REPORT="coverage/coverage-summary.json"
          if [ -f "$REPORT" ]; then
            PCT=$(jq '.total.lines.pct' "$REPORT")
            echo "coverage_percent=$PCT" >> $GITHUB_OUTPUT
            echo "Line coverage: ${PCT}%"
          else
            echo "coverage_percent=100" >> $GITHUB_OUTPUT
            echo "::warning::coverage-summary.json not found - using default 100% (placeholder)"
          fi

      - name: Install Trivy
        continue-on-error: true
        run: |
          wget -qO trivy.deb "https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.deb"
          sudo dpkg -i trivy.deb
          rm trivy.deb

      - name: Run Trivy security scan
        id: trivy_scan
        continue-on-error: true
        run: |
          trivy fs . \
            --exit-code 0 \
            --no-progress \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-results.json

      - name: Parse security score
        id: security
        continue-on-error: true
        run: |
          if [ -f trivy-results.json ]; then
            CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo 0)
          else
            CRIT=0
            HIGH=0
          fi
          SCORE=$(( 100 - (CRIT * 10) - (HIGH * 5) ))
          SCORE=$(( SCORE < 0 ? 0 : SCORE ))
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "detail=critical=${CRIT}, high=${HIGH}" >> $GITHUB_OUTPUT
          echo "Security score: ${SCORE}% (critical=${CRIT}, high=${HIGH})"

      - name: Set default security score if not found
        if: failure()
        run: |
          echo "score=100" >> $GITHUB_OUTPUT
          echo "detail=critical=0, high=0" >> $GITHUB_OUTPUT
          echo "::warning::Trivy scan skipped - using default 100% (placeholder)"

      - name: Build project
        id: build
        continue-on-error: true
        run: npm run build

      # Sanitize branch name — removes / and other chars invalid in artifact names
      - name: Sanitize ref name for artifact
        id: ref
        run: |
          echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c1-50)" >> $GITHUB_OUTPUT

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ steps.ref.outputs.name }}-run${{ github.run_number }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-${{ steps.ref.outputs.name }}-run${{ github.run_number }}
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # JOB 1 - QUALITY GATE (PRs to ot-integration - draft enforcement)
  # Runs on every PR open/synchronize targeting ot-integration.
  # FAIL → converts PR to Draft + adds labels + comments scores
  # PASS → marks PR Ready for review + removes labels + comments scores
  # ===========================================================================
  quality-gate-pr:
    name: "Quality Gate - Pull Request to ot-integration"
    runs-on: ubuntu-latest
    needs: shared-ci
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'ot-integration' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize')

    steps:
      - name: Evaluate PR quality gate
        id: gate
        continue-on-error: true
        run: |
          COVERAGE="${{ needs.shared-ci.outputs.coverage_score }}"
          SECURITY="${{ needs.shared-ci.outputs.security_score }}"
          FAIL=false
          [[ "${{ needs.shared-ci.outputs.lint_status }}"  != "success" ]] && FAIL=true
          [[ "${{ needs.shared-ci.outputs.test_status }}"  != "success" ]] && FAIL=true
          [[ "${{ needs.shared-ci.outputs.build_status }}" != "success" ]] && FAIL=true
          (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )) && FAIL=true
          (( $(echo "$SECURITY < ${{ env.SECURITY_SCORE_THRESHOLD }}" | bc -l) )) && FAIL=true
          [[ "$FAIL" == "true" ]] && exit 1
          echo "::notice::PR quality gate passed"

      - name: PR FAILED - draft and label
        if: steps.gate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = "## Quality Gate FAILED\n\n"
              + "This PR has been converted to **Draft** to prevent accidental merging.\n\n"
              + "| Check | Result |\n|---|---|\n"
              + "| Lint | " + "${{ needs.shared-ci.outputs.lint_status }}" + " |\n"
              + "| Tests | " + "${{ needs.shared-ci.outputs.test_status }}" + " |\n"
              + "| Build | " + "${{ needs.shared-ci.outputs.build_status }}" + " |\n"
              + "| Coverage | " + "${{ needs.shared-ci.outputs.coverage_score }}" + "% (need >= ${{ env.COVERAGE_THRESHOLD }}%) |\n"
              + "| Security | " + "${{ needs.shared-ci.outputs.security_score }}" + "% (need >= ${{ env.SECURITY_SCORE_THRESHOLD }}%) |\n"
              + "| Security detail | " + "${{ needs.shared-ci.outputs.security_detail }}" + " |\n\n"
              + "Fix the issues above and push again.";
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr, labels: ["do-not-merge", "quality-gate-failed"] });
            await github.rest.pulls.update({ owner, repo, pull_number: pr, draft: true });

      - name: PR PASSED - mark ready
        if: steps.gate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const label of ["do-not-merge", "quality-gate-failed"]) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr, name: label }); } catch (_) {}
            }
            await github.rest.pulls.update({ owner, repo, pull_number: pr, draft: false });
            const body = "## Quality Gate PASSED\n\n"
              + "PR is now **Ready for review**.\n\n"
              + "| Check | Result |\n|---|---|\n"
              + "| Lint | " + "${{ needs.shared-ci.outputs.lint_status }}" + " |\n"
              + "| Tests | " + "${{ needs.shared-ci.outputs.test_status }}" + " |\n"
              + "| Build | " + "${{ needs.shared-ci.outputs.build_status }}" + " |\n"
              + "| Coverage | " + "${{ needs.shared-ci.outputs.coverage_score }}" + "% |\n"
              + "| Security | " + "${{ needs.shared-ci.outputs.security_score }}" + "% |\n"
              + "| Security detail | " + "${{ needs.shared-ci.outputs.security_detail }}" + " |";
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });

  # ===========================================================================
  # JOB 2A - AUTO REQUEST REVIEWERS for story-wise PR to ot-integration
  #
  # Runs when a PR is opened targeting ot-integration (from any story branch).
  # Automatically requests reviews from govinddhawale14 and bhushand-xts.
  # Either reviewer's approval will trigger auto-merge.
  # ===========================================================================
  auto-request-reviewers-integration:
    name: "Auto-Request Reviewers for ot-integration"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'ot-integration' &&
      github.event.action == 'opened'

    steps:
      - name: Request reviews from designated reviewers
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;

            await github.rest.pulls.requestReviewers({
              owner, repo,
              pull_number: prNumber,
              reviewers: ["govinddhawale14", "bhushand-xts"]
            });

            console.log("Review requested from govinddhawale14 and bhushand-xts for PR #" + prNumber);

  # ===========================================================================
  # JOB 2B - REVIEW GATE for PRs into ot-integration
  #
  # Runs on every PR open/synchronize targeting ot-integration.
  # Posts a PENDING/FAILED check until at least 1 approved review exists.
  # This enforces the 1-review rule without needing branch protection settings.
  # ===========================================================================
  validate-integration-pr-source:
    name: "Validate PR Source - ot-integration"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'ot-integration' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: Allow any story branch into ot-integration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            // Reject PRs from main or QA directly into ot-integration
            const forbiddenSources = new Set(['main', 'QA']);

            if (forbiddenSources.has(pr.head.ref)) {
              const message = [
                "**PR closed automatically.**",
                "",
                "`ot-integration` does not accept PRs from `main` or `QA`.",
                "",
                "Received source branch: `" + pr.head.ref + "`"
              ].join("\n");

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: message
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: "closed"
              });

              core.setFailed("Invalid PR source for ot-integration: " + pr.head.ref);
              return;
            }

            console.log("Allowed story branch into ot-integration: " + pr.head.ref);

  # ===========================================================================
  # JOB 3 - REVIEW GATE for PRs into ot-integration (1 approval required)
  # ===========================================================================
  review-gate-integration:
    name: "Review Gate - ot-integration (1 approval required)"
    runs-on: ubuntu-latest
    needs: [shared-ci, validate-integration-pr-source]
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'ot-integration' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: Check review count on this PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });

            // Count only the latest review per reviewer — approved state wins
            const latestByReviewer = {};
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED' || review.state === 'DISMISSED') {
                latestByReviewer[review.user.login] = review.state;
              }
            }

            const approvalCount = Object.values(latestByReviewer).filter(s => s === 'APPROVED').length;
            console.log("Approvals on PR #" + prNumber + ": " + approvalCount);

            if (approvalCount < 1) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: "**Review required before merge into ot-integration.**\n\n"
                  + "This PR needs at least **1 approved review** before it can be merged.\n"
                  + "Once approved, the workflow will automatically merge it and create a QA PR."
              });
              core.setFailed("Merge blocked - 0 approved reviews. At least 1 required.");
            } else {
              console.log("Review gate passed - " + approvalCount + " approval(s) found.");
            }

  # ===========================================================================
  # JOB 4A - AUTO MERGE integration PR when approved
  #
  # Triggers when a reviewer APPROVES a PR whose base is ot-integration.
  # Automatically merges the approved PR into ot-integration.
  # ===========================================================================
  auto-merge-integration-pr:
    name: "Auto-Merge Integration PR on Approval"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'ot-integration' &&
      github.event.pull_request.merged == false

    steps:
      - name: Verify at least 1 approved review before merging
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });

            const latestByReviewer = {};
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED' || review.state === 'DISMISSED') {
                latestByReviewer[review.user.login] = review.state;
              }
            }

            const approvalCount = Object.values(latestByReviewer).filter(s => s === 'APPROVED').length;

            if (approvalCount < 1) {
              core.setFailed("Merge blocked — no approved reviews found.");
              return;
            }

            console.log("Review check passed — " + approvalCount + " approval(s).");

      - name: Checkout repository for local merge
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge approved integration PR into ot-integration (WITHOUT pushing)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Get PR details from GitHub context
          PR_NUMBER=${{ github.event.pull_request.number }}
          HEAD_REF=${{ github.event.pull_request.head.ref }}
          BASE_REF=${{ github.event.pull_request.base.ref }}

          # Fetch both branches
          git fetch origin ${BASE_REF} ${HEAD_REF}

          # Checkout base branch (ot-integration)
          git checkout -B ${BASE_REF} origin/${BASE_REF}

          # Merge the head branch (story branch) into base
          git merge --no-ff --no-edit origin/${HEAD_REF} \
            -m "chore: merge ${HEAD_REF} into ${BASE_REF} (approved by reviewer)"

          echo "✓ Merged ${HEAD_REF} into ${BASE_REF}"
          echo "⏸️  MANUAL VALIDATION REQUIRED"
          echo "⏸️  Test the code locally, then manually push to origin/${BASE_REF}"
          echo "⏸️  This will trigger the auto PR to QA"

  # ===========================================================================
  # JOB 4B - FORWARD TO QA after validation (on push to ot-integration)
  #
  # Triggers when code is PUSHED to ot-integration (after manual validation).
  # Creates a fresh PR from ot-integration → QA for QA testing.
  #
  # STALE PR FIX: existing open QA PRs are closed before creating a new one,
  # ensuring QA always sees the latest validated code.
  # ===========================================================================
  forward-to-qa-on-push:
    name: "Create Auto PR to QA (on ot-integration push)"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'ot-integration'

    steps:
      - name: Close stale QA PRs and create fresh PR to QA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ── STALE PR FIX ───────────────────────────────────────────
            // Close any existing open PRs from ot-integration → QA
            // before creating a new one. This ensures QA always gets a fresh PR.
            const existing = await github.rest.pulls.list({
              owner, repo,
              head: owner + ":ot-integration",
              base: "QA",
              state: "open"
            });

            for (const stalePr of existing.data) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: stalePr.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: stalePr.number,
                body: "Automatically closed — a newly validated integration push has been detected.\nA fresh QA PR is being created."
              });
              console.log("Closed stale QA PR #" + stalePr.number);
            }

            // ── CREATE FRESH QA PR ─────────────────────────────────────
            const body = "## QA Testing Required\n\n"
              + "A new validated integration build is ready for manual testing.\n\n"
              + "**To approve and release to production:**\n"
              + "1. Pull `QA` and run manual tests\n"
              + "2. Add the label **`qa-approved`** to this PR\n"
              + "3. The workflow will auto-merge into `QA`\n\n"
              + "| Field | Value |\n|---|---|\n"
              + "| Source | ot-integration (validated) |\n"
              + "| Trigger commit | ${{ github.sha }} |";

            const result = await github.rest.pulls.create({
              owner, repo,
              title: "QA: ot-integration to QA (validated)",
              body,
              head: "ot-integration",
              base: "QA"
            });

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: result.data.number,
              labels: ["qa-testing", "awaiting-qa-approval"]
            });

            console.log("Fresh QA PR created: " + result.data.html_url);

  # ===========================================================================
  # JOB 5 - VALIDATE PR SOURCE for QA (QA)
  #
  # Only ot-integration is allowed to open PRs into QA.
  # Any direct PR from another branch is closed automatically.
  # ===========================================================================
  validate-qa-pr-source:
    name: "Validate PR Source - QA"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'QA' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || github.event.action == 'labeled')

    steps:
      - name: Allow only ot-integration into QA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (pr.head.ref === 'ot-integration') {
              console.log("Allowed QA PR source: " + pr.head.ref);
              return;
            }

            const message = [
              "**PR closed automatically.**",
              "",
              "`QA` accepts PRs only from `ot-integration`.",
              "",
              "Received source branch: `" + pr.head.ref + "`"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: "closed"
            });

            core.setFailed("Invalid PR source for QA: " + pr.head.ref);

  # ===========================================================================
  # JOB 6 - QA APPROVAL GATE
  # Triggers when "qa-approved" label is added to a PR into QA.
  # Merges the PR into QA only.
  # The later push to QA triggers the direct sync job below.
  # ===========================================================================
  qa-approval-gate:
    name: "QA Approval Gate"
    runs-on: ubuntu-latest
    needs: validate-qa-pr-source
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'QA' &&
      github.head_ref == 'ot-integration' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'qa-approved' &&
      github.base_ref == 'QA'

    steps:
      - name: Merge QA PR into QA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: "squash",
              commit_title: "chore: qa-approved merge into QA"
            });
            console.log("Merged QA PR #" + context.issue.number);

  # ===========================================================================
  # JOB 7 - VALIDATE PR SOURCE for main
  #
  # Only QA is allowed to open PRs into main.
  # Any direct PR from another branch is closed automatically.
  # ===========================================================================
  validate-main-pr-source:
    name: "Validate PR Source - main"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: Allow only QA into main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (pr.head.ref === 'QA') {
              console.log("Allowed main PR source: " + pr.head.ref);
              return;
            }

            const message = [
              "**PR closed automatically.**",
              "",
              "`main` accepts PRs only from `QA`.",
              "",
              "Received source branch: `" + pr.head.ref + "`"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: "closed"
            });

            if (pr.head.ref !== 'QA') {
              core.setFailed("Invalid PR source for main: " + pr.head.ref);
            }

  # ===========================================================================
  # JOB 8 - CREATE RELEASE PR after QA branch update
  #
  # After QA is updated from ot-integration, open a separate PR from QA to main
  # and request approval from Parikshit150890.
  # ===========================================================================
  create-main-pr-after-qa-sync:
    name: "Create PR from QA to main (Parikshit150890 approval required)"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'QA'

    steps:
      - name: Close stale main PRs and create fresh PR to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner, repo,
              head: owner + ":QA",
              base: "main",
              state: "open"
            });

            for (const stalePr of existing.data) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: stalePr.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: stalePr.number,
                body: "Automatically closed — a newer QA merge has happened. A fresh PR to `main` is being created."
              });
              console.log("Closed stale main PR #" + stalePr.number);
            }

            const body = "## Production Approval Required\n\n"
              + "QA branch has been updated from `ot-integration`. This PR requires approval from **Parikshit150890** before merging to production.\n\n"
              + "**Next step:** Parikshit150890 reviews and approves this PR, then it will auto-merge to `main`.\n\n"
              + "| Field | Value |\n|---|---|\n"
              + "| Source | QA |\n"
              + "| Updated from | ot-integration |\n"
              + "| Trigger commit | ${{ github.sha }} |";

            const result = await github.rest.pulls.create({
              owner, repo,
              title: "Release: QA to main (Parikshit150890 approval required)",
              body,
              head: "QA",
              base: "main"
            });

            // Request review from Parikshit150890
            await github.rest.pulls.requestReviewers({
              owner, repo,
              pull_number: result.data.number,
              reviewers: ["Parikshit150890"]
            });

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: result.data.number,
              labels: ["production-release", "awaiting-parikshit-approval"]
            });

            console.log("Production release PR created: " + result.data.html_url);

  # ===========================================================================
  # JOB 9 - AUTO MERGE main PR when Parikshit150890 approves
  #
  # Triggers when Parikshit150890 approves a PR whose base is main.
  # Automatically merges the approved PR into main (production).
  # ===========================================================================
  auto-merge-main-on-parikshit-approval:
    name: "Auto-Merge to Production (Parikshit150890 approval)"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'Parikshit150890' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.merged == false

    steps:
      - name: Verify Parikshit150890 approval before merging to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });

            // Check if Parikshit150890 has approved
            const parikshitApproved = reviews.data.some(review =>
              review.user.login === 'Parikshit150890' && review.state === 'APPROVED'
            );

            if (!parikshitApproved) {
              core.setFailed("Merge blocked — Parikshit150890 approval not found.");
              return;
            }

            console.log("Parikshit150890 approval verified — proceeding with merge.");

      - name: Merge approved main PR into main (production)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            // ✓ 1. Already merged check
            if (pr.merged) {
              console.log("PR already merged. Skipping...");
              return;
            }

            // ✓ 2. Draft check
            if (pr.draft) {
              core.setFailed("PR is still draft.");
              return;
            }

            // ✓ 3. State check
            if (pr.state !== "open") {
              console.log("PR not open. Skipping...");
              return;
            }

            // ✓ 4. Mergeability check
            if (pr.mergeable === false) {
              core.setFailed("PR has merge conflicts. Cannot merge to production.");
              return;
            }

            // ⏳ Sometimes mergeable is null — wait & retry once
            if (pr.mergeable === null) {
              console.log("Mergeable state unknown. Waiting...");
              await new Promise(resolve => setTimeout(resolve, 5000));

              const { data: retryPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });

              if (retryPr.mergeable === false) {
                core.setFailed("PR still not mergeable after retry.");
                return;
              }
            }

            // ✓ 5. Merge safely to production
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "squash",
              commit_title: "chore: release QA to main (approved by Parikshit150890)"
            });

            console.log("Merged PR #" + prNumber + " to production successfully");
