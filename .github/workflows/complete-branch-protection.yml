name: Complete Branch Flow - Dev to Integration to QA

# ═══════════════════════════════════════════════════════════════════════════════
# BRANCH FLOW
#
#  dev_bhushan   ──┐
#  dev_sharon    ──┤  quality gate   auto PR     1 review    auto PR     qa-approved
#  dev_gayatri   ──┼─ (must pass) ──────────── ot-integration ────────── dev_parikshit ✓
#  dev_govind    ──┘                                                      (QA Ready)
#
# KEY RULES:
#  1. Quality gate must pass on dev branch before PR to ot-integration is raised
#  2. PR into ot-integration requires at least 1 approved review before merging
#  3. After review approval, PR is auto-merged into ot-integration
#  4. After merge into ot-integration, auto PR is raised to dev_parikshit (QA)
#  5. QA team tests and adds label "qa-approved" to approve for deployment
#  6. After qa-approved label, PR is auto-merged into dev_parikshit
#  7. dev_parikshit is ready for manual deployment (no automatic client approval flow)
#  8. Stale PR fix: old open PRs are closed before a new one is created
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - "dev_bhushan"
      - "dev_sharon"
      - "dev_gayatri"
      - "dev_govind"
      - "ot-integration"
      - "dev_parikshit"

  pull_request:
    # opened/synchronize → shared-ci + quality-gate-pr (draft enforcement)
    # closed             → forward-to-qa after integration merge
    # labeled            → qa-approval-gate
    types: [opened, synchronize, reopened, closed, labeled]
    branches:
      - "dev_bhushan"
      - "dev_sharon"
      - "dev_gayatri"
      - "dev_govind"
      - "ot-integration"
      - "dev_parikshit"

  # Needed to detect when a reviewer approves a PR into ot-integration
  pull_request_review:
    types: [submitted]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: 80
  SECURITY_SCORE_THRESHOLD: 80
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ===========================================================================
  # JOB 0 - SHARED CI
  # Runs on every push and PR open/synchronize.
  # Lint · Vitest coverage · Trivy security scan · Build
  # All downstream jobs consume its outputs — nothing re-installs.
  # ===========================================================================
  shared-ci:
    name: "Shared CI - Lint, Test, Coverage, Security, Build"
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    outputs:
      lint_status:     ${{ steps.lint.outcome }}
      test_status:     ${{ steps.tests.outcome }}
      build_status:    ${{ steps.build.outcome }}
      coverage_score:  ${{ steps.coverage.outputs.coverage_percent }}
      security_score:  ${{ steps.security.outputs.score }}
      security_detail: ${{ steps.security.outputs.detail }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: npm run test:coverage

      - name: Parse coverage score
        id: coverage
        run: |
          REPORT="coverage/coverage-summary.json"
          if [ -f "$REPORT" ]; then
            PCT=$(jq '.total.lines.pct' "$REPORT")
            echo "coverage_percent=$PCT" >> $GITHUB_OUTPUT
            echo "Line coverage: ${PCT}%"
          else
            echo "coverage_percent=0" >> $GITHUB_OUTPUT
            echo "::warning::coverage-summary.json not found"
          fi

      - name: Install Trivy
        continue-on-error: true
        run: |
          wget -qO trivy.deb "https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.deb"
          sudo dpkg -i trivy.deb
          rm trivy.deb

      - name: Run Trivy security scan
        id: trivy_scan
        continue-on-error: true
        run: |
          trivy fs . \
            --exit-code 0 \
            --no-progress \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-results.json

      - name: Parse security score
        id: security
        run: |
          if [ -f trivy-results.json ]; then
            CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo 0)
          else
            CRIT=0
            HIGH=0
          fi
          SCORE=$(( 100 - (CRIT * 10) - (HIGH * 5) ))
          SCORE=$(( SCORE < 0 ? 0 : SCORE ))
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "detail=critical=${CRIT}, high=${HIGH}" >> $GITHUB_OUTPUT
          echo "Security score: ${SCORE}% (critical=${CRIT}, high=${HIGH})"

      - name: Build project
        id: build
        continue-on-error: true
        run: npm run build

      # Sanitize branch name — removes / and other chars invalid in artifact names
      - name: Sanitize ref name for artifact
        id: ref
        run: |
          echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c1-50)" >> $GITHUB_OUTPUT

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ steps.ref.outputs.name }}-run${{ github.run_number }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-${{ steps.ref.outputs.name }}-run${{ github.run_number }}
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # JOB 1 - QUALITY GATE (dev branch pushes only)
  # Blocks with exit 1 if any metric is below threshold.
  # Downstream Job 3 (auto PR to integration) depends on this passing.
  # ===========================================================================
  quality-gate-dev:
    name: "Quality Gate - Dev Branch Push"
    runs-on: ubuntu-latest
    needs: shared-ci
    if: |
      github.event_name == 'push' &&
      contains(fromJson('["dev_parikshit","dev_bhushan","dev_sharon","dev_gayatri","dev_govind"]'), github.ref_name)

    steps:
      - name: Evaluate quality thresholds
        run: |
          COVERAGE="${{ needs.shared-ci.outputs.coverage_score }}"
          SECURITY="${{ needs.shared-ci.outputs.security_score }}"
          LINT_OK="${{ needs.shared-ci.outputs.lint_status }}"
          TESTS_OK="${{ needs.shared-ci.outputs.test_status }}"
          BUILD_OK="${{ needs.shared-ci.outputs.build_status }}"

          echo "========================================="
          echo "         QUALITY GATE - DEV PUSH"
          echo "========================================="
          printf "  %-18s %s\n"   "Lint:"      "$LINT_OK"
          printf "  %-18s %s\n"   "Tests:"     "$TESTS_OK"
          printf "  %-18s %s\n"   "Build:"     "$BUILD_OK"
          printf "  %-18s %s%%\n" "Coverage:"  "$COVERAGE"
          printf "  %-18s %s%%\n" "Security:"  "$SECURITY"
          echo "========================================="

          FAIL=false
          [[ "$LINT_OK"  != "success" ]] && echo "::error::Lint failed"  && FAIL=true
          [[ "$TESTS_OK" != "success" ]] && echo "::error::Tests failed" && FAIL=true
          [[ "$BUILD_OK" != "success" ]] && echo "::error::Build failed" && FAIL=true
          (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )) \
            && echo "::error::Coverage ${COVERAGE}% below ${{ env.COVERAGE_THRESHOLD }}%" && FAIL=true
          (( $(echo "$SECURITY < ${{ env.SECURITY_SCORE_THRESHOLD }}" | bc -l) )) \
            && echo "::error::Security ${SECURITY}% below ${{ env.SECURITY_SCORE_THRESHOLD }}%" && FAIL=true

          [[ "$FAIL" == "true" ]] && echo "::error::QUALITY GATE FAILED - push blocked" && exit 1
          echo "::notice::QUALITY GATE PASSED"

  # ===========================================================================
  # JOB 2 - QUALITY GATE (PRs - draft enforcement)
  # Runs on every PR open/synchronize to any branch.
  # FAIL → converts PR to Draft + adds labels + comments scores
  # PASS → marks PR Ready for review + removes labels + comments scores
  # ===========================================================================
  quality-gate-pr:
    name: "Quality Gate - Pull Request"
    runs-on: ubuntu-latest
    needs: shared-ci
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize')

    steps:
      - name: Evaluate PR quality gate
        id: gate
        continue-on-error: true
        run: |
          COVERAGE="${{ needs.shared-ci.outputs.coverage_score }}"
          SECURITY="${{ needs.shared-ci.outputs.security_score }}"
          FAIL=false
          [[ "${{ needs.shared-ci.outputs.lint_status }}"  != "success" ]] && FAIL=true
          [[ "${{ needs.shared-ci.outputs.test_status }}"  != "success" ]] && FAIL=true
          [[ "${{ needs.shared-ci.outputs.build_status }}" != "success" ]] && FAIL=true
          (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )) && FAIL=true
          (( $(echo "$SECURITY < ${{ env.SECURITY_SCORE_THRESHOLD }}" | bc -l) )) && FAIL=true
          [[ "$FAIL" == "true" ]] && exit 1
          echo "::notice::PR quality gate passed"

      - name: PR FAILED - draft and label
        if: steps.gate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = "## Quality Gate FAILED\n\n"
              + "This PR has been converted to **Draft** to prevent accidental merging.\n\n"
              + "| Check | Result |\n|---|---|\n"
              + "| Lint | " + "${{ needs.shared-ci.outputs.lint_status }}" + " |\n"
              + "| Tests | " + "${{ needs.shared-ci.outputs.test_status }}" + " |\n"
              + "| Build | " + "${{ needs.shared-ci.outputs.build_status }}" + " |\n"
              + "| Coverage | " + "${{ needs.shared-ci.outputs.coverage_score }}" + "% (need >= ${{ env.COVERAGE_THRESHOLD }}%) |\n"
              + "| Security | " + "${{ needs.shared-ci.outputs.security_score }}" + "% (need >= ${{ env.SECURITY_SCORE_THRESHOLD }}%) |\n"
              + "| Security detail | " + "${{ needs.shared-ci.outputs.security_detail }}" + " |\n\n"
              + "Fix the issues above and push again.";
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr, labels: ["do-not-merge", "quality-gate-failed"] });
            await github.rest.pulls.update({ owner, repo, pull_number: pr, draft: true });

      - name: PR PASSED - mark ready
        if: steps.gate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const label of ["do-not-merge", "quality-gate-failed"]) {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr, name: label }); } catch (_) {}
            }
            await github.rest.pulls.update({ owner, repo, pull_number: pr, draft: false });
            const body = "## Quality Gate PASSED\n\n"
              + "PR is now **Ready for review**.\n\n"
              + "| Check | Result |\n|---|---|\n"
              + "| Lint | " + "${{ needs.shared-ci.outputs.lint_status }}" + " |\n"
              + "| Tests | " + "${{ needs.shared-ci.outputs.test_status }}" + " |\n"
              + "| Build | " + "${{ needs.shared-ci.outputs.build_status }}" + " |\n"
              + "| Coverage | " + "${{ needs.shared-ci.outputs.coverage_score }}" + "% |\n"
              + "| Security | " + "${{ needs.shared-ci.outputs.security_score }}" + "% |\n"
              + "| Security detail | " + "${{ needs.shared-ci.outputs.security_detail }}" + " |";
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });

  # ===========================================================================
  # JOB 3 - AUTO PR: dev branch → ot-integration
  #
  # Runs only after quality-gate-dev passes.
  # STALE PR FIX: If an open PR already exists for this head→base pair,
  # it is closed first before a fresh PR is created. This prevents the
  # "new push syncs to old failed PR" problem.
  # ===========================================================================
  auto-forward-to-integration:
    name: "Auto PR to ot-integration"
    runs-on: ubuntu-latest
    needs: [shared-ci, quality-gate-dev]
    if: |
      github.event_name == 'push' &&
      contains(fromJson('["dev_parikshit","dev_bhushan","dev_sharon","dev_gayatri","dev_govind"]'), github.ref_name)

    steps:
      - name: Close stale PR and create fresh PR to ot-integration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const source = context.ref.replace("refs/heads/", "");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = "ot-integration";

            // ── STALE PR FIX ───────────────────────────────────────────
            // Find any existing open PRs from this source branch to integration.
            // Close them all before creating a new one so a new push always
            // gets a clean PR with the latest commit — no stale sync issues.
            const existing = await github.rest.pulls.list({
              owner, repo,
              head: owner + ":" + source,
              base,
              state: "open"
            });

            for (const stalePr of existing.data) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: stalePr.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: stalePr.number,
                body: "Automatically closed — a newer push from `" + source + "` has passed the quality gate.\nA fresh PR will be created momentarily."
              });
              console.log("Closed stale PR #" + stalePr.number);
            }

            // ── CREATE FRESH PR ────────────────────────────────────────
            const body = "## Integration PR\n\n"
              + "Quality Gate passed. This PR requires **at least 1 approved review** before merging.\n\n"
              + "| Check | Result |\n|---|---|\n"
              + "| Lint | ${{ needs.shared-ci.outputs.lint_status }} |\n"
              + "| Tests | ${{ needs.shared-ci.outputs.test_status }} |\n"
              + "| Build | ${{ needs.shared-ci.outputs.build_status }} |\n"
              + "| Coverage | ${{ needs.shared-ci.outputs.coverage_score }}% |\n"
              + "| Security | ${{ needs.shared-ci.outputs.security_score }}% |\n\n"
              + "| Field | Value |\n|---|---|\n"
              + "| Source | " + source + " |\n"
              + "| Actor | ${{ github.actor }} |\n"
              + "| Commit | ${{ github.sha }} |";

            const result = await github.rest.pulls.create({
              owner, repo,
              title: "Integration: " + source + " to ot-integration",
              body,
              head: source,
              base
            });

            // Request reviews from designated reviewers
            await github.rest.pulls.requestReviewers({
              owner, repo,
              pull_number: result.data.number,
              reviewers: ["bhushand-xts", "govinddhawale14"]
            });

            console.log("Fresh integration PR created: " + result.data.html_url);

  # ===========================================================================
  # JOB 4 - REVIEW GATE for PRs into ot-integration
  #
  # Runs on every PR open/synchronize targeting ot-integration.
  # Posts a PENDING/FAILED check until at least 1 approved review exists.
  # This enforces the 1-review rule without needing branch protection settings.
  # ===========================================================================
  validate-integration-pr-source:
    name: "Validate PR Source - ot-integration"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'ot-integration' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: Allow only developer branches into ot-integration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const allowedSources = new Set([
              'dev_parikshit',
              'dev_bhushan',
              'dev_sharon',
              'dev_gayatri',
              'dev_govind'
            ]);

            if (allowedSources.has(pr.head.ref)) {
              console.log("Allowed integration PR source: " + pr.head.ref);
              return;
            }

            const message = [
              "**PR closed automatically.**",
              "",
              "`ot-integration` accepts PRs only from approved developer branches:",
              "- `dev_parikshit`",
              "- `dev_bhushan`",
              "- `dev_sharon`",
              "- `dev_gayatri`",
              "- `dev_govind`",
              "",
              "Received source branch: `" + pr.head.ref + "`"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: "closed"
            });

            core.setFailed("Invalid PR source for ot-integration: " + pr.head.ref);

  review-gate-integration:
    name: "Review Gate - ot-integration (1 approval required)"
    runs-on: ubuntu-latest
    needs: [shared-ci, validate-integration-pr-source]
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'ot-integration' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: Check review count on this PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });

            // Count only the latest review per reviewer — approved state wins
            const latestByReviewer = {};
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED' || review.state === 'DISMISSED') {
                latestByReviewer[review.user.login] = review.state;
              }
            }

            const approvalCount = Object.values(latestByReviewer).filter(s => s === 'APPROVED').length;
            console.log("Approvals on PR #" + prNumber + ": " + approvalCount);

            if (approvalCount < 1) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: "**Review required before merge into ot-integration.**\n\n"
                  + "This PR needs at least **1 approved review** before it can be merged.\n"
                  + "Once approved, the workflow will automatically merge it and create a QA PR."
              });
              core.setFailed("Merge blocked - 0 approved reviews. At least 1 required.");
            } else {
              console.log("Review gate passed - " + approvalCount + " approval(s) found.");
            }

  # ===========================================================================
  # JOB 5 - AUTO MERGE + FORWARD TO QA after integration PR is approved
  #
  # Triggers when a reviewer APPROVES a PR whose base is ot-integration.
  # Automatically merges the approved PR into ot-integration, then creates
  # a fresh PR from ot-integration → qa.
  #
  # STALE PR FIX applied here too: existing open QA PRs are closed before
  # creating a new one, ensuring QA always sees the latest integrated code.
  # ===========================================================================
  forward-to-qa-after-review:
    name: "Merge Integration PR and Forward to QA"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'ot-integration' &&
      github.event.pull_request.merged == false

    steps:
      - name: Verify at least 1 approved review before merging
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });

            const latestByReviewer = {};
            for (const review of reviews.data) {
              if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED' || review.state === 'DISMISSED') {
                latestByReviewer[review.user.login] = review.state;
              }
            }

            const approvalCount = Object.values(latestByReviewer).filter(s => s === 'APPROVED').length;

            if (approvalCount < 1) {
              core.setFailed("Merge blocked — no approved reviews found.");
              return;
            }

            console.log("Review check passed — " + approvalCount + " approval(s).");

      - name: Merge approved integration PR into ot-integration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            // ✓ 1. Already merged check
            if (pr.merged) {
              console.log("PR already merged. Skipping...");
              return;
            }

            // ✓ 2. Draft check
            if (pr.draft) {
              core.setFailed("PR is still draft.");
              return;
            }

            // ✓ 3. State check
            if (pr.state !== "open") {
              console.log("PR not open. Skipping...");
              return;
            }

            // ✓ 4. Mergeability check
            if (pr.mergeable === false) {
              core.setFailed("PR has merge conflicts. Cannot merge.");
              return;
            }

            // ⏳ Sometimes mergeable is null — wait & retry once
            if (pr.mergeable === null) {
              console.log("Mergeable state unknown. Waiting...");
              await new Promise(resolve => setTimeout(resolve, 5000));

              const { data: retryPr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });

              if (retryPr.mergeable === false) {
                core.setFailed("PR still not mergeable after retry.");
                return;
              }
            }

            // ✓ 5. Merge safely
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "squash",
              commit_title: "chore: merge " + pr.head.ref + " into ot-integration (approved)"
            });

            console.log("Merged PR #" + prNumber + " successfully");

      - name: Close stale QA PRs and create fresh PR to qa
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ── STALE PR FIX ───────────────────────────────────────────
            // Close any existing open PRs from ot-integration → qa
            // before creating a new one. This ensures QA always gets a fresh PR.
            const existing = await github.rest.pulls.list({
              owner, repo,
              head: owner + ":ot-integration",
              base: "dev_parikshit",
              state: "open"
            });

            for (const stalePr of existing.data) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: stalePr.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: stalePr.number,
                body: "Automatically closed — a newly approved integration has been merged.\nA fresh QA PR is being created."
              });
              console.log("Closed stale QA PR #" + stalePr.number);
            }

            // ── CREATE FRESH QA PR ─────────────────────────────────────
            const sourcePr = context.payload.pull_request;
            const body = "## QA Testing Required\n\n"
              + "A new integration build is ready for manual testing.\n\n"
              + "**To approve and release to production:**\n"
              + "1. Pull `qa` and run manual tests\n"
              + "2. Add the label **`qa-approved`** to this PR\n"
              + "3. The workflow will merge into `qa` and create a client QA PR\n\n"
              + "| Field | Value |\n|---|---|\n"
              + "| Source | ot-integration |\n"
              + "| Merged PR | #" + sourcePr.number + " |\n"
              + "| Developer branch | " + sourcePr.head.ref + " |";

            const result = await github.rest.pulls.create({
              owner, repo,
              title: "QA: ot-integration to qa",
              body,
              head: "ot-integration",
              base: "dev_parikshit"
            });

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: result.data.number,
              labels: ["qa-testing", "awaiting-qa-approval"]
            });

            console.log("Fresh QA PR created: " + result.data.html_url);

  # ===========================================================================
  # JOB 6 - VALIDATE PR SOURCE for qa
  #
  # Only ot-integration is allowed to open PRs into qa.
  # Any direct PR from another branch is closed automatically.
  # ===========================================================================
  validate-qa-pr-source:
    name: "Validate PR Source - dev_parikshit"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev_parikshit' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened' || github.event.action == 'labeled')

    steps:
      - name: Allow only ot-integration into dev_parikshit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (pr.head.ref === 'ot-integration') {
              console.log("Allowed QA PR source: " + pr.head.ref);
              return;
            }

            const message = [
              "**PR closed automatically.**",
              "",
              "`dev_parikshit` accepts PRs only from `ot-integration`.",
              "",
              "Received source branch: `" + pr.head.ref + "`"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: "closed"
            });

            core.setFailed("Invalid PR source for dev_parikshit: " + pr.head.ref);

  # ===========================================================================
  # JOB 8 - QA APPROVAL GATE
  # Triggers when "qa-approved" label is added to a PR into qa.
  # Merges the PR into qa only.
  # The later push to qa triggers the direct sync job below.
  # ===========================================================================
  qa-approval-gate:
    name: "QA Approval Gate"
    runs-on: ubuntu-latest
    needs: validate-qa-pr-source
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'dev_parikshit' &&
      github.head_ref == 'ot-integration' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'qa-approved' &&
      github.base_ref == 'dev_parikshit'

    steps:
      - name: Merge QA PR into dev_parikshit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: "squash",
              commit_title: "chore: qa-approved merge into dev_parikshit"
            });
            console.log("Merged QA PR #" + context.issue.number);

  # ===========================================================================
  # JOB 9 - DIRECT QA SYNC on push to qa
  #
  # Every push to qa is synced directly into main without opening a PR.
  # ===========================================================================
  sync-qa-to-main-on-push:
    name: "Sync dev_parikshit to main on Push"
    runs-on: ubuntu-latest
    needs: shared-ci
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'dev_parikshit'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync dev_parikshit into main directly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main dev_parikshit

          MAIN_SHA=$(git rev-parse origin/main)
          PARIKSHIT_SHA=$(git rev-parse origin/dev_parikshit)

          if [ "$MAIN_SHA" = "$PARIKSHIT_SHA" ]; then
            echo "main already contains the latest dev_parikshit commit. Skipping sync."
            exit 0
          fi

          git checkout -B main origin/main
          git merge --no-ff --no-edit origin/dev_parikshit
          git push origin main

  # ===========================================================================
  # JOB 10 - VALIDATE PR SOURCE for main
  #
  # Only qa is allowed to open PRs into main.
  # Any direct PR from another branch is closed automatically.
  # ===========================================================================
  validate-main-pr-source:
    name: "Validate PR Source - main"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: Allow only qa into main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (pr.head.ref === 'qa') {
              console.log("Allowed main PR source: " + pr.head.ref);
              return;
            }

            const message = [
              "**PR closed automatically.**",
              "",
              "`main` accepts PRs only from `dev_parikshit`.",
              "",
              "Received source branch: `" + pr.head.ref + "`"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: message
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              state: "closed"
            });

            if (pr.head.ref !== 'dev_parikshit') {
              core.setFailed("Invalid PR source for main: " + pr.head.ref);
            }

  # ===========================================================================
  # JOB 11 - CREATE RELEASE PR after qa branch update
  #
  # After qa is updated from ot-integration, open a separate PR from qa to main
  # and wait for client approval.
  # ===========================================================================
  create-main-pr-after-qa-sync:
    name: "Create PR from dev_parikshit to main"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref_name == 'dev_parikshit'

    steps:
      - name: Close stale main PRs and create fresh PR to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existing = await github.rest.pulls.list({
              owner, repo,
              head: owner + ":dev_parikshit",
              base: "main",
              state: "open"
            });

            for (const stalePr of existing.data) {
              await github.rest.pulls.update({
                owner, repo,
                pull_number: stalePr.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: stalePr.number,
                body: "Automatically closed — a newer dev_parikshit merge has happened. A fresh PR to `main` is being created."
              });
              console.log("Closed stale main PR #" + stalePr.number);
            }

            const body = "## Client Production Approval Required\n\n"
              + "dev_parikshit (QA) has been updated from `ot-integration`. This separate PR is now ready for production approval.\n\n"
              + "**Next step:** client reviews and merges this PR into `main`.\n\n"
              + "| Field | Value |\n|---|---|\n"
              + "| Source | dev_parikshit |\n"
              + "| Updated from | ot-integration |\n"
              + "| Trigger commit | ${{ github.sha }} |";

            const result = await github.rest.pulls.create({
              owner, repo,
              title: "Client Release: dev_parikshit to main",
              body,
              head: "dev_parikshit",
              base: "main"
            });

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: result.data.number,
              labels: ["client-production-review"]
            });

            console.log("Client main PR created: " + result.data.html_url);
