# PROPOSED ONLY: operations require the proposed SDL and scoped backend authorization.
query OpportunityWorkflowPage($filter: WorkflowListInput!) {
 opportunityWorkflowPage(filter: $filter) { nodes { id number title estimatedValue currencyCode clientName owner { id name email roles active } priority state rfpType submissionDeadline revision packageRevision allowedActions } totalCount endCursor hasNextPage }
}
query OpportunityWorkspace($id: ID!, $mode: WorkflowMode!) { opportunityWorkspace(id: $id, mode: $mode) { ...WorkspaceFields } }
query ClientDirectoryPage($search: String!, $after: String, $first: Int!) { clientDirectoryPage(search: $search, after: $after, first: $first) { nodes { ...ClientFields } totalCount endCursor hasNextPage } }
query EligibleOpportunityUsers($input: WorkflowEligibleInput!) { eligibleOpportunityUsers(input: $input) { nodes { id name email roles active } totalCount endCursor hasNextPage } }
query OpportunityExtractionStatus($opportunityId: ID!, $jobId: ID!) { opportunityExtractionStatus(opportunityId: $opportunityId, jobId: $jobId) { ...WorkspaceFields } }
mutation SaveOpportunityWorkflow($input: WorkflowSaveInput!) { saveOpportunityWorkflow(input: $input) { ...WorkspaceFields } }
mutation SaveOpportunityClient($input: WorkflowClientSaveInput!) { saveOpportunityClient(input: $input) { ...ClientFields } }
mutation UploadOpportunitySource($input: WorkflowUploadInput!) { uploadOpportunitySource(input: $input) { id name downloadUrl } }
mutation StartOpportunityExtraction($input: WorkflowExtractInput!) { startOpportunityExtraction(input: $input) { ...WorkspaceFields } }
mutation SaveOpportunityEstimation($input: WorkflowEstimateSaveInput!) { saveOpportunityEstimation(input: $input) { ...WorkspaceFields } }
mutation SaveOpportunityScope($input: WorkflowScopeSaveInput!) { saveOpportunityScope(input: $input) { ...WorkspaceFields } }
mutation AssignOpportunityResponse($input: WorkflowAssignmentInput!) { assignOpportunityResponse(input: $input) { ...WorkspaceFields } }
mutation SaveOpportunityAnswer($input: WorkflowAnswerInput!) { saveOpportunityAnswer(input: $input) { ...WorkspaceFields } }
mutation ReviewOpportunityAnswer($input: WorkflowAnswerReviewInput!) { reviewOpportunityAnswer(input: $input) { ...WorkspaceFields } }
mutation DecideOpportunityPackage($input: WorkflowDecisionInput!) { decideOpportunityPackage(input: $input) { ...WorkspaceFields } }
fragment WorkspaceFields on WorkflowWorkspace { id number title estimatedValue currencyCode clientName owner { id name email roles active } priority state rfpType submissionDeadline revision packageRevision allowedActions form { title estimatedValue currencyId serviceLine leadSource ownerId priority description clientId solicitation { reference version issuingAgency procurementContact submissionMethod vendorDemo portalUrl submissionEmail deliveryInstructions contractTerm incumbentVendor preBidMeeting submissionTimezone } dates { issueDate questionsDue proposalDue submissionDeadline additionalDeadline additionalDeadlineLabel } context { instructions submissionRequirements opportunityOverview scopeOfWork requirements notes } rfp { type source { id name downloadUrl } extraction { id state error } questions { id masterQuestionId text sourceReference validated } sections { key instructions } submissionFormat outputFormat evaluation } } client { id revision name relationship accountTypeId industryId accountTypeName industryName website address country stateProvince city streetAddress primaryContact { id name title email phone decisionRole } additionalContacts { id name title email phone decisionRole } allowedActions } visibleModules responses { id title sourceValidated sourceReference owner { id name email roles active } reviewer { id name email roles active } dueDate answer state revision submittedRevision approvedRevision reviewComment allowedActions } estimation { revision rows { id workItem hours people hourlyRate } assumptions total } scope { revision summary alignment { id text } risks { id description severity } } activity { id action actor { id name email roles active } at note packageRevision } responsible { id name email roles active } approvalAssignees { id name email roles active } readiness { ready issues } salesRecommendation { actor { id name email roles active } note packageRevision } }
fragment ClientFields on WorkflowClient { id revision name relationship accountTypeId industryId accountTypeName industryName website address country stateProvince city streetAddress primaryContact { id name title email phone decisionRole } additionalContacts { id name title email phone decisionRole } allowedActions }

query OpportunityWorkflowActions { opportunityWorkflowActions }
