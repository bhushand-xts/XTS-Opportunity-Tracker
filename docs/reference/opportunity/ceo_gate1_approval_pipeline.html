function renderDetail(){let o=current();$('#main').innerHTML=`<button class="back" onclick="goPipeline()">← Back to Pipeline</button><div class="heading"><div><div class="flex">${badge(o.status)}<span class="tiny muted">${o.id} · submitted package v${o.revision}</span></div><h1 style="margin-top:12px">${esc(o.title)}</h1><p class="sub">${esc(o.client)} · submitted by ${o.owner}</p></div><span class="pill purple">${role.label} review</span></div><div class="workspace-strip"><div><small>Opportunity value</small><strong>${money(o.value)}</strong></div><div><small>Submission deadline</small><strong>${o.deadline}</strong><small>Asia/Kolkata</small></div><div><small>RFP type</small><strong>${o.type}</strong></div><div><small>Response readiness</small><strong>3 / 3 approved</strong><small>Package revision ${o.revision}</small></div></div>${o.status===stagePending?`<div class="reviewbanner"><div><h3>${role.key==='head'?'Your sales approval is required':'Your Gate 1 decision is required'}</h3><p class="sub">${role.key==='head'?'Approval sends this opportunity to CEO / Approver for Gate 1.':'Sales Head approved this package. Review the bid fit, scope and commercials.'}</p></div><div class="flex wrap"><button class="primary" onclick="beginDecision('approve')">${role.approveLabel}</button><button class="danger-outline" onclick="beginDecision('reject')">${role.rejectLabel}</button></div></div>`:`<div class="decision-result ${o.status===stages[2]?'negative':''}"><h3>${esc(o.status)}</h3><p>${esc(o.decision?.note||'Approved without an additional note.')}</p><small>${esc(o.decision?.actor)} · ${time(o.decision?.at)} · package v${o.revision}</small></div>`}<nav class="workspace-tabs" aria-label="Opportunity review tabs">${['Overview','Responses','Estimation & Scope','Activity & Decisions'].map(t=>`<button class="${tab===t?'active':''}" aria-current="${tab===t?'page':'false'}" onclick="tab='${t}';renderDetail()">${t}</button>`).join('')}</nav>${tab==='Overview'?overview(o):tab==='Responses'?responses(o):tab==='Estimation & Scope'?estimate(o):activity(o)}`}
function overview(o){return `<div class="previewgrid"><div>${panel('Opportunity details',`<dl class="kvgrid">${kv('Owner',o.owner)}${kv('Priority',o.priority)}${kv('Service line','Digital engineering')}${kv('Source','RFP / Tender')}${kv('Description',o.summary)}</dl>`)}${panel('Client & primary contact',`<h3>${esc(o.client)}</h3><dl class="kvgrid">${kv('Relationship','Existing customer')}${kv('Account type','Enterprise')}${kv('Industry',o.industry)}${kv('Location',o.city+', India')}${kv('Contact',o.contact)}${kv('Designation','Procurement Manager')}${kv('Email',o.email)}${kv('Decision role','Procurement lead')}</dl>`,'client-preview')}</div><div>${panel('RFP & procurement details',`<dl class="kvgrid">${kv('Solicitation reference',o.ref)}${kv('Version','1.0')}${kv('Issuing department',o.client+' · Procurement')}${kv('Procurement contact',o.contact)}${kv('Submission method','Online portal')}${kv('Portal','https://procurement.example.test')}${kv('Contract term','12 months + optional support')}${kv('Vendor demonstration','Yes')}${kv('Pre-bid meeting','Completed')}${kv('Issue date','2026-10-01')}${kv('Questions due','2026-11-01')}${kv('Proposal due / deadline',o.deadline)}${kv('Timezone','Asia/Kolkata')}${kv('Source document',o.ref+'.pdf')}</dl><p class="tiny muted">Sample document reference; no document bytes are included.</p>`)}${panel('Review summary',`<dl>${kv('Scope',o.scope)}${kv('Estimated delivery cost',money(total(o)))}${kv('Key assumption','Client provides licences, access and timely stakeholder approvals.')}${kv('Commercial consideration','Final bid pricing is subject to agreed scope and delivery capacity.')}</dl><div class="flex wrap"><button onclick="tab='Responses';renderDetail()">Review approved responses</button><button onclick="tab='Estimation & Scope';renderDetail()">View estimation & scope</button></div>`)}${role.key==='ceo'?panel('Sales Head recommendation','<span class="pill green">Approved by Priya Sharma</span><p style="margin:14px 0 0;font-size:12px">Business fit and the response package were reviewed. Recommended for Gate 1 Go consideration.</p>'):''}</div><aside class="progress-panel">${progress(o)}</aside></div>`}
function progress(o){let headDone=role.key==='ceo'||o.status==='Gate 1 pending',go=o.status==='Gate 1 Go',rejected=o.status===stages[2];let list=[['Opportunity created','done'],['Response package prepared','done'],['Sales Head approval',headDone?'done':rejected?'stopped':'current'],['CEO · Gate 1',go?'done':role.key==='ceo'&&!rejected?'current':role.key==='ceo'&&rejected?'stopped':o.status==='Gate 1 pending'?'current':''],['Gate 1 complete',go?'done':'']];return panel('Opportunity progress',`<ol class="stage-track">${list.map(([name,state],i)=>`<li class="${state}"><span>${state==='done'?'✓':state==='stopped'?'×':i+1}</span><div><strong>${name}</strong><small>${state==='done'?'Completed':state==='current'?'Awaiting decision':state==='stopped'?'Closed with decision':'Not started'}</small></div></li>`).join('')}</ol><div class="notice">${rejected?'Closed: '+esc(o.status):go?'Gate 1 passed. Further stages are outside this prototype.':o.status==='Gate 1 pending'?'Next action: CEO / Approver makes the Gate 1 decision.':'Next action: Sales Head approves or rejects.'}</div><h3>Latest update</h3><p class="sub">${esc(o.history[0].action)}</p><p class="tiny muted">${esc(o.history[0].actor)}<br>${time(o.history[0].time)}</p>`)}
function responses(o){return panel('Approved response package',`<p class="sub">Read-only submitted snapshot · revision ${o.revision}. All three responses were approved before submission.</p>${o.responses.map((q,i)=>`<article class="approved-response"><div class="flex between"><span class="tiny muted">${o.type==='Generic RFP'?'SECTION':'QUESTION'} ${i+1}</span><span class="pill green">Approved</span></div><h3>${esc(q.title)}</h3><p>${esc(q.answer)}</p><div class="sub">Owner: ${q.owner} · Reviewer: ${q.reviewer} · Due: ${q.due}</div></article>`).join('')}`)}
function estimate(o){return `<div class="estimate-grid">${panel('Estimation matrix',`<p class="sub">Read-only submitted estimate · INR · revision 1</p><div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>Work item</th><th>Hours / person</th><th>People</th><th>Rate / hour</th><th>Total</th></tr></thead><tbody>${o.estimate.map(r=>`<tr><td>${r.name}</td><td>${r.hours}</td><td>${r.people}</td><td>${money(r.rate)}</td><td>${money(r.hours*r.people*r.rate)}</td></tr>`).join('')}</tbody></table></div><div class="modulefooter"><span>Total estimated delivery cost</span><strong class="estimate-total">${money(total(o))}</strong></div><p class="sub">Assumes agreed scope, client-provided licences and standard working hours. Taxes and third-party fees are excluded.</p>`)}${panel('Scope definition',`<dl>${kv('Objective',o.summary)}${kv('Deliverables',o.scope)}${kv('Inclusions','Discovery, solution design, implementation, validation and knowledge transfer.')}${kv('Exclusions','Third-party licences, hardware procurement and unapproved change requests.')}${kv('Dependencies','Client access, subject-matter experts, integration specifications and timely sign-off.')}${kv('Acceptance criteria','Agreed deliverables accepted against documented functional, security and performance requirements.')}</dl>`)}</div>`}
function activity(o){return panel('Activity & decisions',`<p class="sub">Recorded actions for ${o.id} · submitted package revision ${o.revision}</p><div class="activity-list">${o.history.map(e=>`<article><span class="avatar">${e.actor.split(' ').slice(0,2).map(x=>x[0]).join('')}</span><div><h3>${esc(e.action)}</h3><p class="sub">${esc(e.actor)} · ${time(e.time)}</p>${e.note?'<p style="font-size:12px;margin:10px 0 0">'+esc(e.note)+'</p>':''}</div></article>`).join('')}</div>`)}
function beginDecision(action){let o=current();if(!o||o.status!==stagePending)return toast('This opportunity already has a decision.');pendingAction=action;let approve=action==='approve';$('#decisionTitle').textContent=approve?role.approveLabel:role.rejectLabel;$('#decisionSubtitle').textContent=o.id+' · '+o.title;$('#decisionConsequence').textContent=approve?(role.key==='head'?'The opportunity will move to Gate 1 pending. CEO / Approver is the next decision owner.':'The opportunity will move to Gate 1 Go. This approved package remains available for reference.'):(role.key==='head'?'The opportunity will move to Rejected by Sales Head. It will not advance to CEO approval.':'The opportunity will close as No-Go. The decision and reason will remain in its history.');$('#reasonLabel').textContent=approve?'Decision note (optional)':'Reason (required)';$('#decisionReason').required=!approve;$('#decisionReason').value='';$('#reviewConfirmed').checked=false;$('#confirmDecision').textContent=approve?role.approveLabel:role.rejectLabel;$('#decisionActor').textContent='Recorded as '+role.name+' · '+role.label+' · package v'+o.revision;$('#decisionDialog').showModal()}
function closeDecision(){$('#decisionDialog').close();pendingAction=null}
$('#decisionForm').onsubmit=e=>{e.preventDefault();let o=current();if(!o||o.status!==stagePending||!pendingAction)return;let approve=pendingAction==='approve',note=$('#decisionReason').value.trim();if(!approve&&!note){$('#decisionReason').setCustomValidity('Enter a reason for this decision.');$('#decisionReason').reportValidity();return}$('#decisionReason').setCustomValidity('');let next=structuredClone(opportunities),updated=next.find(x=>x.id===o.id),now=new Date().toISOString();updated.status=approve?stages[1]:stages[2];updated.decision={actor:role.name,role:role.label,at:now,note,packageRevision:o.revision};updated.history.unshift({actor:role.name+' · '+role.label,time:now,action:approve?(role.key==='head'?'Sales Head approved · sent for Gate 1':'CEO approved · Gate 1 Go'):(role.key==='head'?'Sales Head rejected opportunity':'CEO decided · No-Go'),note});try{localStorage.setItem(storageKey,JSON.stringify(next))}catch{toast('Decision could not be saved. Please try again; the opportunity has not changed.');return}opportunities=next;let id=o.id;closeDecision();highlight=id;goPipeline();toast(approve?(role.key==='head'?'Opportunity approved · moved to Gate 1 pending for CEO.':'Gate 1 approved · opportunity moved to Go.'):(role.key==='head'?'Opportunity rejected · reason recorded.':'No-Go recorded · opportunity closed.'));setTimeout(()=>{highlight=null;document.querySelectorAll('.justsaved').forEach(x=>x.classList.remove('justsaved'))},6500)};$('#decisionReason').oninput=()=>$('#decisionReason').setCustomValidity('');
render();
</script></body></html>
